<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Appreciator example</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1f2937;
      }
      appreciator-button {
        --appreciator-size: 2rem;
        font-size: 1.25rem;
        vertical-align: middle;
      }
      .missing {
        color: #b91c1c;
      }
      code {
        background: #f3f4f6;
        padding: 0.1em 0.3em;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <h1>Appreciator example</h1>
    <p>
      Open this page with <code>?api=&lt;server base url&gt;&amp;key=&lt;public key&gt;</code>. Add
      <code>&amp;item=&lt;id&gt;</code> to count against an explicit id instead of this page's URL.
    </p>
    <p id="status" class="missing" hidden>
      Missing the <code>api</code> or <code>key</code> query parameter.
    </p>
    <p id="prompt">Did this help?</p>
    <script>
      // A real page would paste the one tag the server hands out:
      //
      //   <script src="https://appreciator.example.com/widget.js" data-key="pk_…" async><\/script>
      //
      // This page builds the same tag from its query string so one file can
      // point at any server. The bundle finds the server from its own `src`
      // and renders the button right after the tag.
      const params = new URLSearchParams(location.search);
      const api = params.get('api');
      const key = params.get('key');
      const item = params.get('item');

      if (api && key) {
        const script = document.createElement('script');
        script.src = `${api.replace(/\/+$/, '')}/widget.js`;
        script.async = true;
        script.dataset.key = key;
        script.dataset.label = 'Appreciate this page';
        if (item) script.dataset.item = item;
        document.getElementById('prompt').append(' ', script);
      } else {
        document.getElementById('status').hidden = false;
      }
    </script>
  </body>
</html>
